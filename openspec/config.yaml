schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  Проект: классический тетрис для десктопа.

  Технологии:
    - Python 3.14 (виртуальное окружение .venv в корне проекта)
    - pygame-ce для окна, отрисовки, ввода и игрового цикла
    - pytest для автотестов
    - Зависимости фиксируются в requirements.txt

  Архитектура:
    - Игровая логика (поле, фигуры, вращение, коллизии, очистка линий,
      очки, уровни) — чистый Python без импорта pygame, детерминированная
      и полностью тестируемая.
    - Слой представления (pygame) только читает состояние логики и
      передаёт ей команды ввода; правил игры в нём нет.
    - Время передаётся в логику явно (tick/update с dt), а не берётся
      из системных часов — это делает логику тестируемой.

  Объём первой версии (классическое ядро):
    - Поле 10 столбцов × 20 видимых строк
    - 7 тетромино (I, O, T, S, Z, J, L)
    - Движение влево/вправо, мягкое падение, вращение
    - Очистка заполненных линий, подсчёт очков, уровни и рост скорости
    - Превью следующей фигуры
    - Пауза и экран окончания игры (game over) с перезапуском
  Вне рамок первой версии: hold, hard drop, ghost-фигура, 7-bag,
  SRS wall kicks, таблица рекордов, звук и музыка.

  Соглашения:
    - Код и идентификаторы — на английском, PEP 8, аннотации типов
    - Тексты артефактов OpenSpec (proposal, design, tasks, описания
      требований и сценариев) — на русском языке
    - Ключевые слова требований (SHALL/MUST) и маркеры сценариев
      (WHEN/THEN/AND) — на английском, как требует формат OpenSpec

# Per-artifact rules
rules:
  proposal:
    - Всегда включать раздел "Вне рамок" (non-goals)
  specs:
    - Каждое требование сопровождать хотя бы одним сценарием WHEN/THEN
    - Требования формулировать проверяемо, с конкретными числами (размеры, очки, скорости)
  tasks:
    - Задачи игровой логики сопровождать задачами на тесты pytest
    - Разбивать работу на задачи не длиннее ~2 часов
