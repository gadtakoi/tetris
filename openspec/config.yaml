schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  Проект: Tetris Shmetris — классический тетрис для десктопа (Windows).
  Название игры — tetris_ui.GAME_TITLE, имя exe — build_exe.EXE_NAME.

  Технологии:
    - Python 3.14 (виртуальное окружение .venv в корне проекта)
    - pygame-ce для окна, отрисовки, ввода, звука и игрового цикла
    - pytest для автотестов
    - Зависимости игры и тестов — в requirements.txt,
      зависимости сборки (PyInstaller) — в requirements-build.txt

  Архитектура:
    - tetris/ — игровая логика (поле, фигуры, вращение, коллизии, жёсткое
      падение и тень, очистка линий, очки, уровни, гравитация, правила
      таблицы рекордов) — чистый Python без импорта pygame и без
      файлового ввода-вывода, детерминированная и полностью тестируемая.
      Тест tests/test_architecture.py проверяет, что pygame сюда не попадает.
    - tetris_ui/ — слой представления: читает состояние логики и передаёт
      ей команды; правил игры в нём нет. Модули input.py, menus.py, texts.py, guide.py,
      layout.py, settings.py, synth.py, music.py, soundcheck.py, signing.py — без pygame и
      тестируются напрямую; render.py,
      app.py, audio.py — pygame, проверяются дымовыми тестами с
      SDL_VIDEODRIVER/SDL_AUDIODRIVER=dummy.
    - Время передаётся в логику явно (tick с dt в миллисекундах), а не
      берётся из системных часов — это делает логику тестируемой.
    - Звук и музыка синтезируются в коде при запуске, без аудиофайлов.
    - Рекорды и настройки хранятся в %APPDATA%\tetris_shmetris\ (highscores.json,
      settings.json; папка переопределяется переменной TETRIS_DATA_DIR);
      там же отчёт проверки звуков sound-check.json.
    - Таблица рекордов подписана HMAC-SHA256 (tetris_ui/signing.py, формат
      version 2 с полем sig) ключом игры и ID установки из файла install-id
      в той же папке; правленая, чужая или старая таблица читается как
      пустая с предупреждением в консоль.
    - Запуск: python -m tetris_ui (начинается с главного меню, F1 в партии —
      список клавиш, F2 — инструкция в игре);
      проверка звуков: python -m tetris_ui --sound-check;
      сборка одного tetris_shmetris.exe: python build_exe.py
      (проверка сборки — TETRIS_BUILD_TEST=1 pytest).
    - Документация: docs/ (README, architecture, game-logic, interface, build) —
      описывает устройство программы; docs/user-guide.md — инструкция для
      игрока на русском; нормативное поведение — openspec/specs.

  Реализовано:
    - Поле 10 × 20 видимых строк, 7 тетромино, сдвиг, мягкое и жёсткое
      падение, вращение по SRS с wall kicks, тень фигуры
    - Генератор 7-bag, отложенная фигура (hold, C / Shift),
      задержка фиксации 0,5 с (до 15 продлений сдвигом или поворотом)
    - Очистка линий, очки по таблице NES, уровни и гравитация по NES,
      стартовый уровень 0–19
    - Главное меню (New game, High scores, Settings, Controls, Quit),
      меню паузы (Continue / Main menu), экран клавиш по F1
    - Настройки: язык, музыка и эффекты, их громкости, стартовый уровень,
      тень, скорость автоповтора; сохраняются между запусками
    - Очередь из трёх следующих фигур (Game.next_types) и их превью,
      экран game over с перезапуском или выходом в меню
    - Оформление в стиле макета «Стопка»: окно 960 × 720, стакан по центру,
      кремовые карточки с жёсткой тенью (счёт, уровень, линии, рекорд, звук,
      следующие фигуры, запас, управление), тёмная кнопка выбранного пункта;
      шрифты Unbounded и Onest (OFL) в tetris_ui/fonts/, попадают в exe;
      палитра, раскладка и шрифты ролей надписей — tetris_ui/layout.py
    - Таблица рекордов (топ-10 с вводом имени)
    - Звуковые эффекты и фоновая музыка: M/N, громкость музыки −/+,
      громкость эффектов 9/0; мягкий тембр — треугольная волна, ноты
      затухают (кроме level_up, эталона тембра)
    - Интерфейс на английском (по умолчанию) и русском
    - Сборка в один исполняемый файл для Windows
    - Инструкция для игрока docs/user-guide.md
    - Инструкция в игре по F2 и пункту меню «Guide»: 6 страниц на английском
      и русском (тексты — tetris_ui/guide.py)
    - Номер версии игры (tetris_ui.__version__, сейчас 3.0.0): «v3.0.0» в главном
      меню и ресурс версии Windows у tetris_shmetris.exe; как и когда его
      поднимать — docs/build.md
    - Режим проверки звуков (--sound-check, для разработки): 13 пунктов — эффекты
      по отдельности и в сочетаниях, как в партии, и мелодия; отметки
      «неприятно» по X сохраняются в sound-check.json (tetris_ui/soundcheck.py)
  Пока не реализовано: переназначение клавиш, полноэкранный режим и
  масштаб окна, очки за T-spin, combo и back-to-back, очки за падение,
  анимация очистки линий, управление мышью, сброс рекордов из игры.

  Соглашения:
    - Код и идентификаторы — на английском, PEP 8, аннотации типов
    - Тексты артефактов OpenSpec (proposal, design, tasks, описания
      требований и сценариев) — на русском языке
    - Ключевые слова требований (SHALL/MUST) и маркеры сценариев
      (WHEN/THEN/AND) — на английском, как требует формат OpenSpec
    - Каждое существующее требование меняется (MODIFIED) не более чем в
      одном активном изменении одновременно; остальное — через ADDED,
      чтобы изменения не перезаписывали друг друга при архивировании
    - У каждого модуля, класса, функции и метода есть docstring на английском
      (кроме __init__); это проверяет tests/test_docstrings.py
    - Изменение, меняющее устройство программы, обновляет docs/
    - Изменение управления, меню или настроек обновляет и
      docs/user-guide.md, и инструкцию в игре (tetris_ui/guide.py)

# Per-artifact rules
rules:
  proposal:
    - Всегда включать раздел "Вне рамок" (non-goals)
  specs:
    - Каждое требование сопровождать хотя бы одним сценарием WHEN/THEN
    - Требования формулировать проверяемо, с конкретными числами (размеры, очки, скорости)
  tasks:
    - Задачи игровой логики сопровождать задачами на тесты pytest
    - Разбивать работу на задачи не длиннее ~2 часов
