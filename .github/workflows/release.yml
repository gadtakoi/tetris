# Builds the game for Windows, macOS and Linux and publishes a GitHub release when a version
# tag is pushed:
#   git tag v3.0.0 && git push origin v3.0.0
# The tag must be "v" + tetris_ui.__version__, and CHANGELOG.md must have a section for it:
# the section becomes the release text. Run by hand (Actions -> Release -> Run workflow),
# it only builds the files and keeps them as workflow artifacts, without a release.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # PyInstaller builds only for the system it runs on, so each system has its own runner.
    # Linux builds on the oldest runner: the file then runs on systems with that glibc or newer.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: tetris_shmetris.exe
          - os: macos-latest
            asset: tetris_shmetris-macos-arm64.zip
          - os: ubuntu-22.04
            asset: tetris_shmetris-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"
      ASSET: ${{ matrix.asset }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Check the tag and its CHANGELOG.md section
        if: github.ref_type == 'tag'
        run: python release_notes.py "$GITHUB_REF_NAME" > /dev/null

      - name: Run the tests
        run: python -m pytest -q

      - name: Build the game and test it
        env:
          TETRIS_BUILD_TEST: "1"
        run: python -m pytest tests/test_build.py -q

      # The Linux file goes in a .tar.gz, which keeps it executable; the macOS app is a
      # folder, zipped by ditto, which keeps its links, permissions and signature.
      - name: Pack the file for the release
        run: |
          mkdir release
          case "$RUNNER_OS" in
            Windows) cp dist/tetris_shmetris.exe "release/$ASSET" ;;
            macOS) ditto -c -k --keepParent dist/tetris_shmetris.app "release/$ASSET" ;;
            Linux) tar -czf "release/$ASSET" -C dist tetris_shmetris ;;
          esac
          cd release
          if command -v sha256sum > /dev/null; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tetris_shmetris-${{ runner.os }}
          path: release/*

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Take the release text from CHANGELOG.md
        run: python release_notes.py "$GITHUB_REF_NAME" > release-notes.md

      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --title "Tetris Shmetris ${GITHUB_REF_NAME#v}"
          --notes-file release-notes.md
          --verify-tag
